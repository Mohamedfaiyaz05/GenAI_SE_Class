services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in the project .env file}
      NEO4J_URI: ${NEO4J_URI:?Set your Neo4j Aura NEO4J_URI in the project .env file}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the project .env file}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      KNOWLEDGE_BASE_DIR: /app/rag_knowledge_base
      FAISS_INDEX_PATH: /app/faiss_index
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./rag_knowledge_base:/app/rag_knowledge_base
      - faiss_data:/app/faiss_index
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  faiss_data:
